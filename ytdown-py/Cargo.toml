[package]
name = "ytdown-py"
version = "0.7.0" # x-release-please-version
edition = "2021"
description = "Python bindings for the ytdown crate, built with maturin/PyO3."
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/ytdown"
publish = false

[lib]
name = "ytdown"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
# `native-tls-vendored` compiles OpenSSL from source: the manylinux containers
# the wheels are built in ship no OpenSSL headers.
ytdown = { path = "..", features = ["ffmpeg", "native-tls-vendored"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde_json = "1"

# Standalone workspace: keep this crate out of the parent package's build.
[workspace]
