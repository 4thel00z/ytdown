[package]
name = "ytdown"
version = "0.2.0"
edition = "2021"
description = "A Rust library mirroring yt-dlp's core: extract, select, and download media. Library only — no CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/ytdown"
keywords = ["youtube", "download", "media", "yt-dlp"]
categories = ["multimedia", "api-bindings"]
# The Python bindings (ytdown-py) are a separate, unpublished maturin crate.
exclude = ["ytdown-py"]

[features]
default = []
ffmpeg = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"
url = "2"
boa_engine = "0.20"
regex = "1"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

# cargo-husky: the Rust-native alternative to pre-commit. On the first
# build/test it installs the git hooks under `.cargo-husky/hooks/` into
# `.git/hooks`. The `user-hooks` feature uses our own hook script (the
# fmt + clippy + test gate) instead of cargo-husky's defaults.
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
