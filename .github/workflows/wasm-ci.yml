name: wasm-ci

on:
  push:
    branches: [main, master]
    paths:
      - "ytdown-wasm/**"
      - "web/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/wasm-ci.yml"
  pull_request:
    paths:
      - "ytdown-wasm/**"
      - "web/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/wasm-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    name: wasm-pack build + node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ytdown-wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm package
        run: wasm-pack build ytdown-wasm --target web --out-dir pkg
      - name: Node wasm-bindgen test
        run: wasm-pack test --node ytdown-wasm

  sdk:
    name: build + test @4thel00z/ytdown
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ytdown-wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: oven-sh/setup-bun@v2
      - name: Install SDK deps
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build SDK (wasm-pack via package script + tsup)
        working-directory: web
        run: bun run build
      - name: Typecheck SDK
        working-directory: web
        run: bun run typecheck
      - name: Test SDK
        working-directory: web
        run: bun run test
      - name: Install proxy worker deps
        working-directory: web/proxy
        run: bun install --frozen-lockfile
      - name: Test proxy worker
        working-directory: web/proxy
        run: bun run test
